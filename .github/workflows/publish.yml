name: Publish to npm

# Publishes the package to the npm registry with GitHub Actions OIDC (npm trusted publishing).
# No npm token is needed: the package's trusted publisher on npmjs.com must point at this
# repository and this workflow file (publish.yml).
#
# Triggered by a v* tag push, or dispatched (on a v* tag) by the sync-schemas workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile

      - name: Check that the ref is the tag of package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Publish must run on tag v${version} (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})"
            exit 1
          fi
          if npm view "$(node -p "require('./package.json').name")@${version}" version >/dev/null 2>&1; then
            echo "::error::Version ${version} is already published"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Publish
        run: npm publish

      - name: Point schema dist-tags at this version
        # Each schema version tag (e.g. uat-fix44-2026-08-03-25a722a) becomes an npm dist-tag
        # pointing at the newest release that contains that schema version. Needs the
        # "npm dist-tag" action on the trusted publisher. The registry may take a few minutes
        # to expose a freshly published version, hence the retries.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for tag in $(pnpm --silent tags --names); do
            for attempt in $(seq 1 10); do
              if npm dist-tag add "${name}@${version}" "${tag}"; then break; fi
              if [ "${attempt}" = 10 ]; then echo "::error::could not set dist-tag ${tag}"; exit 1; fi
              echo "retrying in 30s (${attempt}/10)"; sleep 30
            done
          done
          npm dist-tag ls "${name}"

      - name: Summary
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "Published [\`${name}@${version}\`](https://www.npmjs.com/package/${name}/v/${version})" >> "$GITHUB_STEP_SUMMARY"
