name: Publish to npm

# Publishes the package to the npm registry with GitHub Actions OIDC (npm trusted publishing).
# No npm token is needed: the package's trusted publisher on npmjs.com must point at this
# repository and this workflow file (publish.yml).
#
# Triggered by a v* tag push, or dispatched (on a v* tag) by the sync-schemas workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile

      - name: Check that the ref is the tag of package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Publish must run on tag v${version} (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})"
            exit 1
          fi
          if npm view "$(node -p "require('./package.json').name")@${version}" version >/dev/null 2>&1; then
            echo "::error::Version ${version} is already published"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Publish
        run: npm publish

      - name: Summary
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "Published [\`${name}@${version}\`](https://www.npmjs.com/package/${name}/v/${version})" >> "$GITHUB_STEP_SUMMARY"
