name: Sync TT FIX schemas

# Fetch the latest TT FIX component schemas (prod + UAT, FIX 4.2 + 4.4) every day,
# regenerate the TypeScript bindings, bump the package version, commit, tag each schema
# version, and dispatch the publish workflow (npm trusted publishing) for the new version.

on:
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch publish.yml

concurrency:
  group: sync-schemas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to know which versions already exist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch schemas
        id: fetch
        run: pnpm fetch-schemas

      - name: Regenerate TypeScript
        run: pnpm generate

      - name: Verify
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Bump version, commit and tag release
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas src/generated
          if git diff --cached --quiet; then
            echo "No schema changes"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(npm version patch --no-git-tag-version)"
          git add package.json
          {
            echo "chore: sync TT FIX schemas ($(date -u +%Y-%m-%d), ${version})"
            echo
            echo "Changed: ${{ steps.fetch.outputs.changed }}"
            echo
            echo "${{ steps.fetch.outputs.summary }}"
          } > /tmp/commit-msg
          git commit -F /tmp/commit-msg
          git tag -a "${version}" -m "${version}"
          git push origin HEAD:${{ github.ref_name }} "${version}"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create and push missing schema tags
        id: tags
        run: pnpm tags --create --push

      - name: Publish to npm
        # Tag pushes made with GITHUB_TOKEN do not trigger workflows, so dispatch publish.yml explicitly.
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ steps.commit.outputs.version }}"

      - name: Summary
        run: |
          {
            echo "## TT FIX schemas"
            echo
            echo "${{ steps.fetch.outputs.summary }}"
            echo
            echo "Committed: ${{ steps.commit.outputs.committed }}"
            echo
            echo "Tags created: \`${{ steps.tags.outputs.created }}\`"
            echo
            echo "Release: ${{ steps.commit.outputs.version || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
