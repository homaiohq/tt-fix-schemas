name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        run: |
          pnpm generate
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated is out of date, run 'pnpm generate' and commit"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
